<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Juegos Hera</title>
  <script>
    /**
     * Router SPA para GitHub Pages.
     *
     * Intercepta cualquier ruta desconocida y la convierte en:
     *   /{repo}/{game}/?uuid={uuid}
     *
     * Ejemplos:
     *   /juegos-hera/connections/b2c3d4e5-...  →  /juegos-hera/connections/?uuid=b2c3d4e5-...
     *   /juegos-hera/wordle/b2c3d4e5-...       →  /juegos-hera/wordle/?uuid=b2c3d4e5-...
     *   /juegos-hera/connections               →  /juegos-hera/connections/
     */
    (function () {
      var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      var JUEGOS  = ["connections", "wordle"];

      var parts = window.location.pathname.split("/").filter(Boolean);
      // parts ej: ["juegos-hera", "connections", "b2c3d4e5-..."]

      // Buscar segmento de juego
      var gameIndex = -1;
      parts.forEach(function (p, i) {
        if (JUEGOS.indexOf(p) !== -1) { gameIndex = i; }
      });

      if (gameIndex !== -1) {
        var basePath = "/" + parts.slice(0, gameIndex + 1).join("/") + "/";
        var uuid = parts[gameIndex + 1];
        var dest = basePath + (uuid && UUID_RE.test(uuid) ? "?uuid=" + uuid : "");
        window.location.replace(dest);
      } else {
        // Ruta desconocida → raíz del repo
        var root = parts.length > 0 ? "/" + parts[0] + "/" : "/";
        window.location.replace(root);
      }
    })();
  </script>
</head>
<body></body>
</html>
