<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;700;800&display=swap');
    body { font-family: 'Karla', sans-serif; }

    /* ── Grid ─────────────────────────────────── */
    #grid-wrapper {
      position: relative;
      display: inline-block;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    #svg-overlay {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }

    /* ── Celda ────────────────────────────────── */
    .cell {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1e3a5f;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
      border: none;
      outline: none;
    }
    @media (max-width: 400px) {
      .cell { width: 46px; height: 46px; font-size: 0.95rem; }
      #grid { gap: 4px; }
    }

    .cell:hover:not(.found-word):not(.found-pangrama) {
      background: #93c5fd;
    }

    .cell.selected {
      background: #facc15;
      color: #1e3a5f;
      transform: scale(1.08);
    }

    .cell.found-word {
      background: #60a5fa;
      color: white;
      cursor: default;
    }

    .cell.found-pangrama {
      background: #f59e0b;
      color: white;
      cursor: default;
    }

    .cell.hint-glow {
      animation: glow 0.7s ease-in-out infinite alternate;
    }

    /* ── Animaciones ──────────────────────────── */
    @keyframes glow {
      from { box-shadow: 0 0 4px  6px rgba(250, 204, 21, 0.4); }
      to   { box-shadow: 0 0 10px 12px rgba(250, 204, 21, 0.8); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-5px); }
      40%      { transform: translateX(5px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.4s ease; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1.08); }
    }
    .pop { animation: pop 0.15s ease forwards; }

    @keyframes bounceIn {
      0%   { transform: scale(0.6); opacity: 0; }
      60%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }
    .bounce-in { animation: bounceIn 0.35s ease forwards; }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center select-none pb-10">

  <!-- Header -->
  <header class="w-full max-w-lg border-b border-gray-200 flex items-center justify-between px-4 py-3">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Hilos</h1>
      <p id="pista-header" class="text-gray-400 text-xs font-medium mt-0.5"></p>
    </div>
    <div class="text-right">
      <p id="tema-header"  class="text-sm font-bold text-gray-700 uppercase tracking-widest"></p>
      <p id="fecha-header" class="text-gray-400 text-xs font-medium"></p>
    </div>
  </header>

  <!-- Toast -->
  <div id="toast"
    class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm
           font-bold px-5 py-2 rounded-lg shadow-lg z-50 pointer-events-none">
  </div>

  <!-- Instrucción -->
  <p class="text-gray-500 text-sm mt-5 mb-3 px-4 text-center max-w-sm">
    Encuentra las palabras relacionadas con el tema.
    Las letras deben ser adyacentes entre sí.
  </p>

  <!-- Grid -->
  <div id="grid-wrapper" class="mt-2">
    <div id="grid"></div>
    <svg id="svg-overlay"></svg>
  </div>

  <!-- Controles -->
  <div class="flex items-center gap-4 mt-6">
    <button id="btn-hint"
      class="px-5 py-2 rounded-full border border-gray-300 text-sm font-bold
             text-gray-700 hover:border-gray-500 hover:bg-gray-50 transition">
      Pista
    </button>
  </div>

  <!-- Status -->
  <p id="status" class="mt-4 text-gray-400 text-sm font-medium"></p>

  <!-- Modal fin de juego -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-xl">
      <div id="modal-emoji" class="text-5xl mb-3"></div>
      <h2 id="modal-title"  class="text-2xl font-extrabold mb-1"></h2>
      <p  id="modal-puzzle" class="text-gray-500 text-sm mb-2"></p>
      <p  id="modal-msg"    class="text-gray-700 font-bold text-base mb-6"></p>
      <button id="btn-close-modal"
        class="px-6 py-2 bg-gray-800 text-white rounded-full font-bold hover:bg-gray-700 transition">
        Cerrar
      </button>
    </div>
  </div>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
